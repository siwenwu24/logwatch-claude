name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=logwatch --cov-report=term-missing

      - name: Smoke-test the CLI against the sample logs
        run: |
          logwatch --version
          logwatch report --dir ./logs
          test "$(logwatch report --dir ./logs --json | python -c 'import json,sys; print(json.load(sys.stdin)["parsed_lines"])')" -gt 0

  docker:
    name: docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Build locally first so the image can be exercised before it is
      # published. Layers are cached, so the push below is a cache hit.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: logwatch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image against a mounted volume
        run: |
          set -euo pipefail

          # One-shot report over the repo's sample logs, mounted read-only.
          docker run --rm -v "$PWD/logs:/logs:ro" logwatch:ci report --dir /logs

          parsed=$(docker run --rm -v "$PWD/logs:/logs:ro" logwatch:ci \
            report --dir /logs --json | python -c 'import json,sys; print(json.load(sys.stdin)["parsed_lines"])')
          echo "parsed_lines=$parsed"
          test "$parsed" -gt 0

          # The container must not run as root.
          test "$(docker run --rm --entrypoint id logwatch:ci -u)" != "0"

          # The default command watches; check it picks up a line appended
          # to the volume while it is running, then exits cleanly on SIGTERM.
          mkdir -p /tmp/livelogs
          echo "2026-08-23T10:00:00 INFO initial line" > /tmp/livelogs/live.log
          docker run -d --name lw-live -v /tmp/livelogs:/logs logwatch:ci \
            watch --dir /logs --interval 1
          sleep 3
          echo "2026-08-23T10:00:05 ERROR appended during watch" >> /tmp/livelogs/live.log
          sleep 3
          docker stop -t 10 lw-live
          docker logs lw-live
          docker logs lw-live 2>&1 | grep -q "ERROR" \
            || { echo "watcher did not pick up the appended line"; exit 1; }
          test "$(docker inspect -f '{{.State.ExitCode}}' lw-live)" = "0"
          docker rm lw-live

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
